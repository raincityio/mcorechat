meshcore:
  driver: tcp
  tcp_endpoint: [ koopa.elisha.raincity.io, 5678 ]
matrix:
  listen: [ 0.0.0.0, 9000 ]
  homeserver: "http://polaris.elisha.raincity.io:8008"
  domain: example.com
  app_user: examplebot
  app_as_token_path: ~/.local/mcorechat/keys.yml
  app_hs_token_path: ~/.local/mcorechat/keys.yml
  app_namespace: mesh_
  contact_name_mappings:
    vashbash: "@vashbash:example.com"
  dev_soft_fail: true

logging_config_path: mcorechat_logging.yml
dev_enable_send: true
advertise_known: true
