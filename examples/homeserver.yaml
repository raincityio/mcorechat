  per_second: 100
  burst_count: 200
rc_login:
  address:
    per_second: 100
    burst_count: 200
  account:
    per_second: 100
    burst_count: 200
rc_joins:
  local:
    per_second: 1000
    burst_count: 2000
  remote:
    per_second: 1000
    burst_count: 2000
rc_invites:
  per_room:
    per_second: 100
    burst_count: 200
  per_user:
    per_second: 100
    burst_count: 200
  per_issuer:
    per_second: 100
    burst_count: 200
rc_message:
  per_second: 100
  burst_count: 200
rc_room_creation:
  per_second: 100
  burst_count: 200
