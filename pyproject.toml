[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcorechat"
version = "0.2"
authors = [
    { name = "Drew Gochenaur" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=5.0",
    "platformdirs>=4.9.2",
    "matrix-nio>=0.25.2",
    "meshcore==2.2.8"
]

[project.scripts]
mcorechat = "mcorechat.mcorechat:main"
matrix-admin-cli = "mcorechat.matrix.admincli:main"

[tool.black]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
include = ["src"]
