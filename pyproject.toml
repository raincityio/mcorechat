[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcorechat"
version = "0.2"
authors = [
    { name = "Drew Gochenaur" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=5.0",
    "platformdirs>=2.3.6",
    "irc>=20.5.0",
    "matrix-nio",
    "pydle",
    "meshcore"
]

[project.scripts]
mcorechat = "mcorechat.mesh2chat:main"
matrix-admin-cli = "mcorechat.matrix.admincli:main"

[tool.black]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
include = ["src"]
